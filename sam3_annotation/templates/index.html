<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM3 自动化标注工具（网页版）</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            /* 阻止触控板横向滑动触发浏览器前进/后退手势（右键操作时易误触） */
            overscroll-behavior-x: none;
        }

        body {
            background: #0f131a;
            color: #d7dde8;
            font-size: 13px;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ---------- 工具栏 ---------- */
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            padding: 8px 10px;
            background: #1e2430;
            border-bottom: 1px solid #2e3646;
        }

        #toolbar .sep {
            width: 1px;
            height: 22px;
            background: #2e3646;
            margin: 0 4px;
        }

        .spacer {
            flex: 1;
        }

        button,
        select,
        input[type=text],
        input[type=number] {
            background: #262e3d;
            color: #d7dde8;
            border: 1px solid #38445a;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 13px;
            outline: none;
        }

        button {
            cursor: pointer;
            transition: background .15s;
        }

        button:hover:not(:disabled) {
            background: #303b4f;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        button.primary {
            background: #2b5fdd;
            border-color: #3d7eff;
        }

        button.primary:hover:not(:disabled) {
            background: #3d7eff;
        }

        button.danger {
            border-color: #7a3038;
        }

        button.danger:hover:not(:disabled) {
            background: #5a2029;
        }

        select {
            max-width: 240px;
        }

        #videoPathInput {
            width: 240px;
        }

        #modelStatus {
            padding: 5px 10px;
            border-radius: 6px;
            background: #262e3d;
            color: #8ea2c0;
        }

        #modelStatus.loaded {
            color: #4ade80;
        }

        #modelStatus.loading {
            color: #facc15;
        }

        #modelStatus.error {
            color: #f87171;
        }

        /* ---------- 主体布局 ---------- */
        #content {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        #sidebar {
            width: 350px;
            min-width: 310px;
            overflow-y: auto;
            padding: 8px;
            background: #181d26;
            border-right: 1px solid #2e3646;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card {
            background: #1e2430;
            border: 1px solid #2e3646;
            border-radius: 8px;
            padding: 10px;
        }

        .card h3 {
            margin: 0 0 8px;
            font-size: 12px;
            color: #8ea2c0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .muted {
            color: #7d8ba1;
            font-size: 12px;
        }

        .highlight {
            color: #facc15;
            word-break: break-all;
        }

        .row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 6px;
        }

        .row>label {
            flex: none;
            color: #8ea2c0;
        }

        .grow {
            flex: 1;
            min-width: 0;
        }

        .btn-block {
            width: 100%;
        }

        .btn-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 6px;
        }

        .btn-4col {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-top: 6px;
        }

        .btn-4col button {
            padding: 5px 0;
        }

        #frameSlider {
            width: 100%;
            margin: 6px 0;
            accent-color: #3d7eff;
        }

        #frameInfo {
            font-size: 15px;
            font-weight: 600;
        }

        #objIdInfo {
            font-size: 14px;
            font-weight: 600;
        }

        #pointCount {
            color: #60a5fa;
            margin-top: 6px;
        }

        #annotHint {
            color: #f87171;
            white-space: pre-line;
            margin-top: 6px;
            line-height: 1.5;
        }

        /* ---------- 目标列表 ---------- */
        #objList {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #2e3646;
            border-radius: 6px;
            background: #161b23;
        }

        .objItem {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 6px 8px;
            border-bottom: 1px solid #222a36;
            cursor: pointer;
        }

        .objItem:last-child {
            border-bottom: none;
        }

        .objItem:hover {
            background: #222b3a;
        }

        .objItem.selected {
            background: #2b3a55;
        }

        .objItem .del {
            padding: 1px 8px;
            font-size: 12px;
            border-radius: 4px;
            background: transparent;
            border-color: #7a3038;
            color: #f87171;
        }

        .objItem .del:hover {
            background: #5a2029;
        }

        /* ---------- 类别设置 ---------- */
        .clsRow {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 2px;
        }

        .clsRow .tag {
            min-width: 44px;
            color: #8ea2c0;
        }

        .clsRow input[type=number] {
            width: 60px;
        }

        .clsRow input[type=text] {
            flex: 1;
            min-width: 0;
        }

        /* ---------- 导出弹窗 ---------- */
        .modalOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modalBox {
            background: #1e2430;
            border: 1px solid #38445a;
            border-radius: 10px;
            padding: 16px;
            min-width: 380px;
            max-width: 540px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modalBox h3 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #8ea2c0;
        }

        .modalActions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }

        /* ---------- 查看区 ---------- */
        #viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #0f131a;
        }

        #viewerTop {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            border-bottom: 1px solid #2e3646;
            background: #161b23;
            min-height: 36px;
        }

        #canvasWrap {
            flex: 1;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        #cv {
            display: block;
            cursor: crosshair;
        }

        #coordInfo {
            padding: 4px 12px;
            border-top: 1px solid #2e3646;
            background: #161b23;
            color: #7d8ba1;
            font-size: 12px;
            min-height: 24px;
        }

        /* ---------- 进度条 ---------- */
        .progress {
            flex: 1;
            height: 8px;
            background: #262e3d;
            border-radius: 4px;
            overflow: hidden;
            min-width: 120px;
            display: none;
        }

        .progress.active {
            display: block;
        }

        .progress>div {
            height: 100%;
            width: 0%;
            background: #3d7eff;
            transition: width .3s;
        }

        /* ---------- 状态栏 ---------- */
        #status {
            padding: 6px 12px;
            background: #1e2430;
            border-top: 1px solid #2e3646;
            color: #aebbd0;
            font-size: 12.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #status.error {
            color: #f87171;
        }

        #status.success {
            color: #4ade80;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #38445a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- ==================== 顶部工具栏 ==================== -->
        <header id="toolbar">
            <select id="videoSelect" title="videos 目录下的视频"></select>
            <button id="openVideoBtn">打开视频</button>
            <input type="text" id="videoPathInput" placeholder="或输入视频绝对路径">
            <button id="openPathBtn">打开</button>
            <button id="uploadVideoBtn" title="上传本地视频文件">上传视频</button>
            <input type="file" id="uploadVideoFile" accept=".mp4,.avi,.mov,.mkv,video/*" style="display:none">
            <span class="sep"></span>
            <button id="saveProjectBtn">保存项目</button>
            <select id="projectSelect" title="已保存的标注项目"></select>
            <button id="loadProjectBtn">加载项目</button>
            <button id="refreshProjectsBtn" title="刷新项目列表">↻</button>
            <span class="sep"></span>
            <label for="gpuSelect" class="muted">GPU:</label>
            <select id="gpuSelect" style="min-width:56px"></select>
            <button id="loadModelBtn">加载SAM3模型</button>
            <button id="runTrackBtn" disabled>运行跟踪</button>
            <span class="sep"></span>
            <input type="text" id="exportName" placeholder="导出名称（默认视频名）" style="width:180px">
            <button id="exportBtn" disabled>导出YOLO</button>
            <span class="spacer"></span>
            <span id="modelStatus">模型: 未加载</span>
        </header>

        <!-- ==================== 主内容 ==================== -->
        <div id="content">
            <!-- 左侧面板 -->
            <aside id="sidebar">
                <div class="card">
                    <h3>视频信息</h3>
                    <div id="videoName" class="highlight">未选择视频</div>
                    <div id="videoMeta" class="muted" style="margin-top:4px"></div>
                </div>

                <div class="card">
                    <h3>帧导航</h3>
                    <div id="frameInfo">帧: 0 / 0</div>
                    <input type="range" id="frameSlider" min="0" max="0" value="0" disabled>
                    <div class="row">
                        <label>跳转:</label>
                        <input type="number" id="jumpInput" class="grow" value="0" min="0">
                        <button id="jumpBtn">Go</button>
                    </div>
                    <div class="btn-4col">
                        <button id="stepBack10" title="后退10帧">⏮</button>
                        <button id="stepBack1" title="后退1帧">◀</button>
                        <button id="stepFwd1" title="前进1帧">▶</button>
                        <button id="stepFwd10" title="前进10帧">⏭</button>
                    </div>
                </div>

                <div class="card">
                    <h3>标注控制</h3>
                    <div id="objIdInfo">下一个目标 ID: 3</div>
                    <button id="startAnnotBtn" class="btn-block" style="margin-top:6px" disabled>📌 开始标注新目标</button>
                    <button id="nextObjBtn" class="btn-block" style="margin-top:6px" disabled>✅ 保存并标注下一个</button>
                    <div class="btn-2col">
                        <button id="undoBtn" disabled>↶ 撤销</button>
                        <button id="clearPointsBtn" disabled>🗑 清空</button>
                    </div>
                    <div id="pointCount">绘制多边形后自动生成 8 正 + 8 负点</div>
                    <div id="annotHint"></div>
                </div>

                <div class="card">
                    <h3>已标注目标</h3>
                    <div id="objList">
                        <div class="muted" style="padding:8px">暂无标注</div>
                    </div>
                </div>

                <div class="card">
                    <h3>类别设置（导出用）</h3>
                    <div id="classList">
                        <div class="muted" style="padding:8px">暂无标注目标</div>
                    </div>
                    <div class="muted" style="margin-top:6px">class 留空则导出时自动分配；类别名写入 classes.txt</div>
                </div>
            </aside>

            <!-- 右侧查看区 -->
            <main id="viewer">
                <div id="viewerTop">
                    <label class="muted"><input type="checkbox" id="showTrackChk"> 显示跟踪结果</label>
                    <span id="viewerInfo" class="muted"></span>
                    <span class="progress" id="progressWrap">
                        <div id="progressBar"></div>
                    </span>
                    <span id="progressText" class="muted"></span>
                </div>
                <div id="canvasWrap"><canvas id="cv"></canvas></div>
                <div id="coordInfo"></div>
            </main>
        </div>

        <!-- ==================== 状态栏 ==================== -->
        <footer id="status">就绪 — 请选择视频文件或打开已有标注项目</footer>
    </div>

    <!-- ==================== 导出弹窗 ==================== -->
    <div id="exportModal" class="modalOverlay" style="display:none">
        <div class="modalBox">
            <h3>导出 YOLO — 填写每个目标的类别名</h3>
            <div id="exportClassRows"></div>
            <div class="muted" style="margin-top:8px">class 编号沿用左侧“类别设置”，未设置的导出时自动分配；名称写入 classes.txt</div>
            <div class="modalActions">
                <button id="exportCancelBtn">取消</button>
                <button id="exportConfirmBtn" class="primary">开始导出</button>
            </div>
        </div>
    </div>
    <script>
        "use strict";

        /* ==================== 全局状态 ==================== */
        const OBJ_COLORS = [
            "#e6194b", "#3cb44b", "#4363d8", "#f58231", "#911eb4",
            "#42d4f4", "#f032e6", "#bfef45", "#fabed4", "#469990",
            "#dcbeff", "#9A6324", "#fffac8", "#800000", "#aaffc3",
            "#808000", "#ffd8b1", "#000075", "#a9a9a9", "#ffffff"
        ];
        // 标注点（星/叉）颜色与目标 ID 颜色一致（OBJ_COLORS），不再区分正负样本颜色

        const S = {
            video: null,
            annotations: {},        // {objId(str): {frame_idx, points:[[x,y]..], labels:[1/0..]}}
            nextObjId: 3,
            idToClass: {},          // {objId: classId} 显式设置的类别映射（导出用）
            classNames: {},         // {classId: 类别名}（写入 classes.txt）
            model: { state: "idle", msg: "" },
            track: { state: "idle", msg: "", done: 0, total: 0, n_frames_with_boxes: 0 },
            export: { state: "idle", msg: "", result: null },

            frameIdx: 0,
            img: null, imgW: 0, imgH: 0,
            viewMode: "frame",      // "frame" | "tracking"
            trackObjects: [],       // 当前帧跟踪框 [[obj_id,x,y,w,h],..]（相对坐标）

            isAnnotating: false,
            currentObjId: 0,
            polyPoints: [],         // 正在绘制的多边形顶点 [[x,y],..]（图像坐标）
            polyMouse: null,        // 鼠标预览位置 [x,y]（图像坐标）

            scale: 1, offX: 0, offY: 0,
            selectedObjId: null,
        };

        const $ = (sel) => document.querySelector(sel);

        /* ==================== 通用工具 ==================== */
        let statusTimer = null;
        function setStatus(msg, type) {
            const el = $("#status");
            el.textContent = msg;
            el.className = type || "";
            if (statusTimer) clearTimeout(statusTimer);
            if (type) statusTimer = setTimeout(() => { el.className = ""; }, 6000);
        }

        async function api(url, opts = {}) {
            try {
                const init = { method: opts.method || "GET", headers: {} };
                if (opts.body !== undefined) {
                    init.headers["Content-Type"] = "application/json";
                    init.body = JSON.stringify(opts.body);
                }
                const res = await fetch(url, init);
                return await res.json();
            } catch (e) {
                setStatus("请求失败: " + e, "error");
                return null;
            }
        }

        function sortedObjIds() {
            return Object.keys(S.annotations).map(Number).sort((a, b) => a - b);
        }

        /* ==================== 状态同步 ==================== */
        async function refreshState(applyAll) {
            const st = await api("/api/state");
            if (!st) return;

            const prevTrackState = S.track.state;
            const prevExportState = S.export.state;

            if (applyAll) {
                S.video = st.video;
                S.annotations = st.annotations || {};
                S.nextObjId = st.next_obj_id || 3;
                S.idToClass = {};
                for (const [k, v] of Object.entries(st.id_to_class || {})) S.idToClass[Number(k)] = Number(v);
                S.classNames = {};
                for (const [k, v] of Object.entries(st.class_names || {})) S.classNames[Number(k)] = String(v);
                S.isAnnotating = false;
                S.polyPoints = [];
                S.polyMouse = null;
                S.selectedObjId = null;
                S.trackObjects = [];
                if (!S.video) S.viewMode = "frame";
            }
            S.model = st.model;
            S.track = st.track;
            S.export = st.export;

            updateGpuList(st.gpus);
            updateVideoUI();
            updateModelUI();
            updateTrackUI();
            updateExportUI();
            updateToolbarButtons();
            updateObjectList();
            updateClassList();
            updateAnnotUI();

            // 跟踪完成 → 自动切换显示跟踪结果
            if (prevTrackState !== "done" && S.track.state === "done") {
                // 退出标注状态（有未提交的点先保存），否则标注模式会拦截跟踪框的拖动
                await commitCurrentObject();
                S.viewMode = "tracking";
                $("#showTrackChk").checked = true;
                setStatus(S.track.msg, "success");
                if (S.video) showFrame(S.frameIdx);
            }
            // 导出完成
            if (prevExportState !== "done" && S.export.state === "done" && S.export.result) {
                const r = S.export.result;
                setStatus(`导出完成: ${r.exported_frames} 帧已导出到 ${r.dir}`, "success");
            }
            if (S.export.state === "error") setStatus(S.export.msg, "error");
            if (S.track.state === "error") setStatus(S.track.msg, "error");

            if (applyAll && S.video) {
                const maxIdx = S.video.total_frames - 1;
                showFrame(Math.max(0, Math.min(S.frameIdx, maxIdx)));
            }
        }

        function updateGpuList(gpus) {
            const sel = $("#gpuSelect");
            if (sel.dataset.filled === "1") return;
            sel.innerHTML = "";
            if (gpus && gpus.length) {
                for (const g of gpus) {
                    const opt = document.createElement("option");
                    opt.value = g;
                    opt.textContent = g;
                    sel.appendChild(opt);
                }
                sel.dataset.filled = "1";
            } else {
                sel.innerHTML = '<option value="">无GPU</option>';
            }
        }

        /* ==================== UI 更新 ==================== */
        function updateVideoUI() {
            const v = S.video;
            if (v) {
                $("#videoName").textContent = "📁 " + v.name;
                $("#videoMeta").textContent =
                    `帧数: ${v.total_frames} | FPS: ${v.fps.toFixed(1)} | 分辨率: ${v.width}×${v.height}`;
                const slider = $("#frameSlider");
                slider.max = Math.max(0, v.total_frames - 1);
                slider.disabled = false;
                $("#startAnnotBtn").disabled = false;
                // 同步视频下拉框选中项
                const sel = $("#videoSelect");
                for (const opt of sel.options) {
                    if (opt.value === v.path) { sel.value = opt.value; break; }
                }
            } else {
                $("#videoName").textContent = "未选择视频";
                $("#videoMeta").textContent = "";
                $("#frameSlider").disabled = true;
                $("#startAnnotBtn").disabled = true;
            }
        }

        function updateFrameUI() {
            const v = S.video;
            $("#frameInfo").textContent = v ? `帧: ${S.frameIdx} / ${v.total_frames - 1}` : "帧: 0 / 0";
            if (v && document.activeElement !== $("#frameSlider")) {
                $("#frameSlider").value = S.frameIdx;
            }
            if (v && document.activeElement !== $("#jumpInput")) {
                $("#jumpInput").value = S.frameIdx;
            }
        }

        function updateModelUI() {
            const el = $("#modelStatus");
            const m = S.model;
            const texts = { idle: "模型: 未加载", loading: "模型: 加载中...", loaded: "模型: 已加载 ✓", error: "模型: 加载失败 ✗" };
            el.textContent = texts[m.state] || m.state;
            el.className = m.state;
        }

        function updateTrackUI() {
            const t = S.track;
            const wrap = $("#progressWrap");
            const bar = $("#progressBar");
            if (t.state === "running") {
                wrap.classList.add("active");
                const pct = t.total > 0 ? Math.min(100, Math.round(t.done / t.total * 100)) : 0;
                bar.style.width = pct + "%";
                $("#progressText").textContent = `${t.msg} (${pct}%)`;
            } else if (S.export.state !== "running") {
                wrap.classList.remove("active");
                $("#progressText").textContent = "";
            }
            $("#viewerInfo").textContent =
                S.viewMode === "tracking"
                    ? `跟踪目标: ${S.trackObjects.length} | 结果帧数: ${t.n_frames_with_boxes}`
                    : "";
        }

        function updateExportUI() {
            if (S.export.state === "running") {
                $("#progressWrap").classList.add("active");
                $("#progressBar").style.width = "100%";
                $("#progressText").textContent = S.export.msg;
            }
        }

        function updateToolbarButtons() {
            const hasAnnot = Object.keys(S.annotations).length > 0;
            const trackRunning = S.track.state === "running";
            const exportRunning = S.export.state === "running";

            $("#runTrackBtn").disabled =
                !(S.model.state === "loaded" && hasAnnot && !!S.video && !trackRunning && !exportRunning);
            $("#loadModelBtn").disabled = S.model.state === "loading" || S.model.state === "loaded";
            $("#exportBtn").disabled =
                !(S.track.n_frames_with_boxes > 0 && !trackRunning && !exportRunning && !!S.video);
            $("#openVideoBtn").disabled = trackRunning;
            $("#openPathBtn").disabled = trackRunning;
            $("#uploadVideoBtn").disabled = trackRunning;
            $("#loadProjectBtn").disabled = trackRunning;
        }

        function updateAnnotUI() {
            $("#objIdInfo").textContent =
                S.isAnnotating ? `正在标注目标 #${S.currentObjId}（下一个 ID: ${S.nextObjId}）` : `下一个目标 ID: ${S.nextObjId}`;
            const nVert = S.polyPoints.length;
            $("#pointCount").textContent = S.isAnnotating
                ? `多边形顶点: ${nVert}${nVert >= 3 ? "（可闭合）" : "（至少 3 个）"}`
                : "绘制多边形后自动生成 8 正 + 8 负点";

            const can = S.isAnnotating;
            $("#nextObjBtn").disabled = !can;
            $("#undoBtn").disabled = !can || nVert === 0;
            $("#clearPointsBtn").disabled = !can || nVert === 0;
            $("#startAnnotBtn").textContent = can ? "↻ 重新开始新目标" : "📌 开始标注新目标";

            if (can) {
                $("#annotHint").textContent =
                    `在目标周围依次左键点击添加多边形顶点：\n` +
                    `  • 点击起点附近 / 双击 / 回车 = 闭合（自动生成 8 正 + 8 负点）\n` +
                    `  • 右键 = 撤销上一个顶点\n  • Esc = 取消当前多边形\n目标 ID: ${S.currentObjId}`;
            } else {
                $("#annotHint").textContent = "";
            }
        }

        function updateObjectList() {
            const box = $("#objList");
            const ids = sortedObjIds();
            if (ids.length === 0) {
                box.innerHTML = '<div class="muted" style="padding:8px">暂无标注</div>';
                return;
            }
            box.innerHTML = "";
            for (const id of ids) {
                const a = S.annotations[String(id)];
                const nPos = a.labels.filter((v) => v === 1).length;
                const nNeg = a.labels.filter((v) => v === 0).length;
                const item = document.createElement("div");
                item.className = "objItem" + (S.selectedObjId === id ? " selected" : "");
                item.dataset.id = id;
                const color = OBJ_COLORS[id % OBJ_COLORS.length];
                const cls = S.idToClass[id] !== undefined ? S.idToClass[id] : "auto";
                item.innerHTML =
                    `<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
         <span style="color:${color}">●</span> 目标 #${id} [cls ${cls}]: 帧 ${a.frame_idx} | ${nPos}正/${nNeg}负
       </span><button class="del" title="删除">×</button>`;
                item.addEventListener("click", (e) => {
                    if (e.target.classList.contains("del")) return;
                    S.selectedObjId = id;
                    showFrame(a.frame_idx);
                    updateObjectList();
                    setStatus(`已跳转到目标 #${id} 的标注帧 ${a.frame_idx}`);
                });
                item.querySelector(".del").addEventListener("click", (e) => {
                    e.stopPropagation();
                    deleteObject(id);
                });
                box.appendChild(item);
            }
        }

        /* ==================== 类别设置（导出用） ==================== */
        function autoClassPreview(ids) {
            // 与后端导出逻辑保持一致：对未设置映射的 ID 按序预测自动分配的 class_id
            const used = new Set(Object.values(S.idToClass).map(Number));
            let next = used.size ? Math.max(...used) + 1 : 0;
            const preview = {};
            for (const id of ids) {
                if (S.idToClass[id] === undefined) preview[id] = next++;
            }
            return preview;
        }

        function updateClassList() {
            const box = $("#classList");
            const ids = sortedObjIds();
            // 用户正在列表内输入时不重建，避免打断输入
            if (box.contains(document.activeElement)) return;
            if (ids.length === 0) {
                box.innerHTML = '<div class="muted" style="padding:8px">暂无标注目标</div>';
                return;
            }
            box.innerHTML = "";
            const preview = autoClassPreview(ids);
            for (const id of ids) {
                const explicit = S.idToClass[id] !== undefined;
                const clsVal = explicit ? S.idToClass[id] : "";
                const effCls = explicit ? S.idToClass[id] : preview[id];
                const nameVal = S.classNames[effCls] || "";
                const row = document.createElement("div");
                row.className = "clsRow";
                row.innerHTML =
                    `<span class="tag">#${id}</span>` +
                    `<input type="number" class="clsNum" min="0" step="1" value="${clsVal}" ` +
                    `placeholder="${explicit ? "" : String(effCls)}" title="class_id（留空 = 导出时自动分配）">` +
                    `<input type="text" class="clsName" value="${nameVal.replace(/"/g, "&quot;")}" ` +
                    `placeholder="类别名" title="类别名（写入 classes.txt）">`;
                const numInput = row.querySelector(".clsNum");
                const nameInput = row.querySelector(".clsName");
                numInput.addEventListener("change", () => {
                    const v = numInput.value.trim();
                    if (v === "") {
                        delete S.idToClass[id];
                    } else {
                        const n = parseInt(v, 10);
                        if (Number.isNaN(n) || n < 0) delete S.idToClass[id];
                        else S.idToClass[id] = n;
                    }
                    pushClassMap();
                    updateClassList();
                    updateObjectList();
                });
                nameInput.addEventListener("change", () => {
                    const v = nameInput.value.trim();
                    const cid = S.idToClass[id] !== undefined ? S.idToClass[id] : preview[id];
                    if (v) S.classNames[cid] = v;
                    else delete S.classNames[cid];
                    pushClassMap();
                });
                box.appendChild(row);
            }
        }

        async function pushClassMap() {
            const r = await api("/api/classes", {
                method: "POST",
                body: { id_to_class: S.idToClass, class_names: S.classNames },
            });
            if (r && r.ok) setStatus("类别设置已更新", "success");
            else setStatus((r && r.error) || "类别保存失败", "error");
        }

        /* ==================== 帧显示 ==================== */
        let frameToken = 0;
        function showFrame(idx) {
            if (!S.video) return;
            idx = Math.max(0, Math.min(idx, S.video.total_frames - 1));
            S.frameIdx = idx;
            updateFrameUI();

            const token = ++frameToken;
            const img = new Image();
            img.onload = async () => {
                if (token !== frameToken) return;   // 过期请求丢弃
                S.img = img;
                S.imgW = img.naturalWidth;
                S.imgH = img.naturalHeight;
                if (S.viewMode === "tracking") await fetchTrackObjects(token);
                if (token !== frameToken) return;
                render();
                updateTrackUI();
            };
            img.onerror = () => {
                if (token !== frameToken) return;
                setStatus(`无法读取第 ${idx} 帧`, "error");
            };
            img.src = "/api/frame?index=" + idx + "&_=" + Date.now();
        }

        async function fetchTrackObjects(token) {
            if (!S.video) { S.trackObjects = []; return; }
            const r = await api("/api/track/frame?index=" + S.frameIdx);
            if (token !== undefined && token !== frameToken) return;
            S.trackObjects = (r && r.objects) || [];
        }

        /* ==================== Canvas 渲染 ==================== */
        function render() {
            const wrap = $("#canvasWrap");
            const cv = $("#cv");
            const dpr = window.devicePixelRatio || 1;
            const cw = wrap.clientWidth, ch = wrap.clientHeight;
            const pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
            if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
            cv.style.width = cw + "px";
            cv.style.height = ch + "px";

            const ctx = cv.getContext("2d");
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cw, ch);

            if (!S.video) {
                ctx.fillStyle = "#39445a";
                ctx.font = "16px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("请选择视频文件", cw / 2, ch / 2);
                return;
            }
            if (!S.img) {
                ctx.fillStyle = "#39445a";
                ctx.font = "15px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("帧加载中...", cw / 2, ch / 2);
                return;
            }

            // 图像适应窗口（保持宽高比、居中）
            const scale = Math.min(cw / S.imgW, ch / S.imgH);
            const dw = S.imgW * scale, dh = S.imgH * scale;
            const ox = (cw - dw) / 2, oy = (ch - dh) / 2;
            S.scale = scale; S.offX = ox; S.offY = oy;

            ctx.drawImage(S.img, ox, oy, dw, dh);

            // 已保存的标注（当前帧上的）：多边形轮廓 + 样本点
            for (const id of sortedObjIds()) {
                const a = S.annotations[String(id)];
                if (a.frame_idx !== S.frameIdx) continue;
                if (Array.isArray(a.polygon) && a.polygon.length >= 3) drawSavedPolygon(ctx, a.polygon, id);
                drawPoints(ctx, a.points, a.labels, id, false);
            }
            // 当前正在绘制的多边形（虚线 + 顶点 + 鼠标预览线）
            if (S.isAnnotating && S.polyPoints.length) {
                drawActivePolygon(ctx);
            }
            // 跟踪框
            if (S.viewMode === "tracking" && S.trackObjects.length) {
                drawTrackBoxes(ctx);
            }
        }

        function toCanvas(x, y) {
            return [S.offX + x * S.scale, S.offY + y * S.scale];
        }

        function drawPoints(ctx, points, labels, objId, isCurrent) {
            const color = OBJ_COLORS[objId % OBJ_COLORS.length];
            for (let i = 0; i < points.length; i++) {
                const [cx, cy] = toCanvas(points[i][0], points[i][1]);
                const isPos = labels[i] === 1;
                // 标记（正样本 ★ / 负样本 ✕）
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#ffffff";
                if (isPos) {
                    ctx.font = "20px sans-serif";
                    ctx.strokeText("★", cx, cy);
                    ctx.fillStyle = color;
                    ctx.fillText("★", cx, cy);
                } else {
                    ctx.font = "bold 18px sans-serif";
                    ctx.strokeText("✕", cx, cy);
                    ctx.fillStyle = color;
                    ctx.fillText("✕", cx, cy);
                }
                // 序号
                const tag = String(i + 1);
                ctx.font = "bold 11px sans-serif";
                ctx.textAlign = "left";
                const tw = ctx.measureText(tag).width + 8;
                ctx.fillStyle = color;
                roundRect(ctx, cx + 8, cy - 14, tw, 15, 4);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.fillText(tag, cx + 12, cy - 6);
            }
            // obj_id 标签
            if (points.length) {
                const [cx, cy] = toCanvas(points[0][0], points[0][1]);
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "left";
                ctx.textBaseline = "middle";
                const tag = "ID:" + objId + (isCurrent ? " ▲" : "");
                const tw = ctx.measureText(tag).width + 12;
                ctx.fillStyle = color;
                const ty = Math.max(0, cy - 44);
                roundRect(ctx, cx, ty, tw, 20, 5);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.fillText(tag, cx + 6, ty + 10);
            }
        }

        function drawTrackBoxes(ctx) {
            ctx.lineWidth = 2.5;
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            for (const [objId, x, y, w, h] of S.trackObjects) {
                const color = OBJ_COLORS[objId % OBJ_COLORS.length];
                // 跟踪框为归一化相对坐标，先乘图像宽高转为像素坐标
                const [x0, y0] = toCanvas(x * S.imgW, y * S.imgH);
                const bw = w * S.imgW * S.scale, bh = h * S.imgH * S.scale;
                ctx.strokeStyle = color;
                ctx.strokeRect(x0, y0, bw, bh);
                const tag = "ID:" + objId;
                const tw = ctx.measureText(tag).width + 10;
                const ty = Math.max(0, y0 - 18);
                ctx.fillStyle = color;
                roundRect(ctx, x0, ty, tw, 17, 4);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.fillText(tag, x0 + 5, ty + 9);

                // 四角手柄（提示可拖动调整大小）
                const hs = 5;
                ctx.fillStyle = "#ffffff";
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                for (const [hx, hy] of [[x0, y0], [x0 + bw, y0], [x0, y0 + bh], [x0 + bw, y0 + bh]]) {
                    ctx.fillRect(hx - hs, hy - hs, hs * 2, hs * 2);
                    ctx.strokeRect(hx - hs, hy - hs, hs * 2, hs * 2);
                }
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // 已保存的多边形轮廓（半透明填充 + 同 ID 颜色虚线描边）
        function drawSavedPolygon(ctx, pts, objId) {
            const color = OBJ_COLORS[objId % OBJ_COLORS.length];
            ctx.save();
            ctx.beginPath();
            const [x0, y0] = toCanvas(pts[0][0], pts[0][1]);
            ctx.moveTo(x0, y0);
            for (let i = 1; i < pts.length; i++) {
                const [px, py] = toCanvas(pts[i][0], pts[i][1]);
                ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = color + "22";
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }

        // 正在绘制的多边形（虚线 + 顶点 + 鼠标预览线，起点高亮提示闭合）
        function drawActivePolygon(ctx) {
            const color = OBJ_COLORS[S.currentObjId % OBJ_COLORS.length];
            const pts = S.polyPoints;
            ctx.save();
            ctx.beginPath();
            const [x0, y0] = toCanvas(pts[0][0], pts[0][1]);
            ctx.moveTo(x0, y0);
            for (let i = 1; i < pts.length; i++) {
                const [px, py] = toCanvas(pts[i][0], pts[i][1]);
                ctx.lineTo(px, py);
            }
            if (S.polyMouse) {
                const [mx, my] = toCanvas(S.polyMouse[0], S.polyMouse[1]);
                ctx.lineTo(mx, my);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
            // 顶点
            ctx.fillStyle = color;
            for (const p of pts) {
                const [px, py] = toCanvas(p[0], p[1]);
                ctx.beginPath();
                ctx.arc(px, py, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
            // 起点高亮（点击起点/双击/回车可闭合）
            if (pts.length >= 3) {
                ctx.beginPath();
                ctx.arc(x0, y0, 7, 0, Math.PI * 2);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.restore();
        }

        /* ==================== 多边形标注：几何算法（参考 production_line.html 零样本标注） ==================== */
        // 点在多边形内（射线法）；pts: [[x,y],...]
        function pointInPolygon(px, py, pts) {
            let inside = false;
            const n = pts.length;
            for (let i = 0, j = n - 1; i < n; j = i++) {
                const [xi, yi] = pts[i], [xj, yj] = pts[j];
                if (((yi > py) !== (yj > py)) &&
                    (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        // 多边形包围盒
        function polygonBBox(pts) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const [x, y] of pts) {
                minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                minY = Math.min(minY, y); maxY = Math.max(maxY, y);
            }
            return { minX, minY, maxX, maxY };
        }

        // 清理多边形顶点：去除连续重复顶点
        function cleanupPolygonPts(pts) {
            const out = [];
            for (const p of pts) {
                const last = out[out.length - 1];
                if (last && Math.abs(p[0] - last[0]) < 1e-6 && Math.abs(p[1] - last[1]) < 1e-6) continue;
                out.push([p[0], p[1]]);
            }
            return out;
        }

        // 点击位置是否靠近起点（闭合判定，图像坐标 12px 容差）
        function nearFirstVertex(x, y) {
            if (!S.polyPoints.length) return false;
            const dx = x - S.polyPoints[0][0];
            const dy = y - S.polyPoints[0][1];
            return dx * dx + dy * dy <= 144;
        }

        // 多边形内均匀取 8 个正样本点：网格候选 + 最远点采样
        function samplePositivePoints(pts) {
            const b = polygonBBox(pts);
            const w = b.maxX - b.minX, h = b.maxY - b.minY;
            const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;
            // 生成多边形内的网格候选点，不足时逐步加密
            let step = Math.max(w, h) / 5;
            let candidates = [];
            for (let iter = 0; iter < 5; iter++) {
                candidates = [];
                const nx = Math.max(2, Math.ceil(w / step));
                const ny = Math.max(2, Math.ceil(h / step));
                for (let iy = 0; iy <= ny; iy++) {
                    for (let ix = 0; ix <= nx; ix++) {
                        const x = b.minX + w * ix / nx;
                        const y = b.minY + h * iy / ny;
                        if (pointInPolygon(x, y, pts)) candidates.push([x, y]);
                    }
                }
                if (candidates.length >= 32) break;
                step /= 2;
            }
            if (candidates.length === 0) candidates.push([cx, cy]);
            // 最远点采样：从最靠近质心的点开始，保证 8 个点尽量均匀分布
            let startIdx = 0, bestD = Infinity;
            candidates.forEach((p, i) => {
                const d = (p[0] - cx) * (p[0] - cx) + (p[1] - cy) * (p[1] - cy);
                if (d < bestD) { bestD = d; startIdx = i; }
            });
            const chosen = [candidates[startIdx]];
            while (chosen.length < 8 && candidates.length > chosen.length) {
                let farIdx = -1, farD = -1;
                candidates.forEach((p, i) => {
                    let minD = Infinity;
                    chosen.forEach(q => {
                        const d = (p[0] - q[0]) * (p[0] - q[0]) + (p[1] - q[1]) * (p[1] - q[1]);
                        if (d < minD) minD = d;
                    });
                    if (minD > farD) { farD = minD; farIdx = i; }
                });
                if (farIdx < 0) break;
                chosen.push(candidates[farIdx]);
            }
            // 候选不足 8 个时，在质心附近环形补点
            let pad = 0;
            while (chosen.length < 8) {
                const ang = pad * Math.PI / 4;
                const rad = Math.max(w, h) * 0.12 * (pad % 2 === 0 ? 0.5 : 1);
                const p = [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad];
                if (pointInPolygon(p[0], p[1], pts) &&
                    !chosen.some(q => Math.abs(q[0] - p[0]) < 1e-6 && Math.abs(q[1] - p[1]) < 1e-6)) {
                    chosen.push(p);
                }
                pad++;
                if (pad > 64) chosen.push([cx, cy]); // 兜底，避免死循环
            }
            return chosen;
        }

        // 多边形外附近取 8 个负样本点：从质心向 8 个方向发射线，
        // 取与多边形边界的最远交点后再外推 offset，得到紧贴框外的点
        function sampleNegativePoints(pts) {
            const b = polygonBBox(pts);
            const w = b.maxX - b.minX, h = b.maxY - b.minY;
            const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;
            const offset = Math.max(15, 0.2 * Math.max(w, h));
            const fallbackT = Math.max(w, h) / 2 + offset;
            const points = [];
            for (let k = 0; k < 8; k++) {
                const ang = (k + 0.5) * Math.PI / 4;
                const dx = Math.cos(ang), dy = Math.sin(ang);
                // 求射线与多边形各边交点的最大 t（该方向上的出射点）
                let tMax = -1;
                const n = pts.length;
                for (let i = 0; i < n; i++) {
                    const j = (i + 1) % n;
                    const [x1, y1] = pts[i], [x2, y2] = pts[j];
                    const ex = x2 - x1, ey = y2 - y1;
                    const denom = dx * ey - dy * ex;
                    if (Math.abs(denom) < 1e-9) continue;
                    const t = ((x1 - cx) * ey - (y1 - cy) * ex) / denom;
                    const u = ((x1 - cx) * dy - (y1 - cy) * dx) / denom;
                    if (t > tMax && u >= 0 && u <= 1) tMax = t;
                }
                if (tMax < 0) tMax = fallbackT;
                const x = Math.min(Math.max(cx + (tMax + offset) * dx, 0), S.imgW - 1);
                const y = Math.min(Math.max(cy + (tMax + offset) * dy, 0), S.imgH - 1);
                points.push([x, y]);
            }
            return points;
        }

        /* ==================== 画布交互（标注点） ==================== */
        function canvasToImage(evt) {
            const rect = $("#cv").getBoundingClientRect();
            const cx = evt.clientX - rect.left;
            const cy = evt.clientY - rect.top;
            const ix = (cx - S.offX) / S.scale;
            const iy = (cy - S.offY) / S.scale;
            return [Math.round(ix), Math.round(iy)];
        }

        /* ==================== 跟踪框拖动调整 ==================== */
        let trackDrag = null;   // 拖动状态 {idx, objId, handle, orig, startX, startY}

        function hitTestBoxes(mx, my) {
            // 从上层（后画的）往下层检测，命中返回 {idx, objId, handle}
            const T = 8; // 命中容差（画布像素）
            for (let i = S.trackObjects.length - 1; i >= 0; i--) {
                const boxArr = S.trackObjects[i];
                const objId = boxArr[0];
                const [x0, y0] = toCanvas(boxArr[1] * S.imgW, boxArr[2] * S.imgH);
                const bw = boxArr[3] * S.imgW * S.scale;
                const bh = boxArr[4] * S.imgH * S.scale;
                if (mx < x0 - T || mx > x0 + bw + T || my < y0 - T || my > y0 + bh + T) continue;
                const onL = Math.abs(mx - x0) <= T;
                const onR = Math.abs(mx - (x0 + bw)) <= T;
                const onT = Math.abs(my - y0) <= T;
                const onB = Math.abs(my - (y0 + bh)) <= T;
                let handle = "move";
                if (onL && onT) handle = "nw";
                else if (onR && onT) handle = "ne";
                else if (onL && onB) handle = "sw";
                else if (onR && onB) handle = "se";
                else if (onL) handle = "w";
                else if (onR) handle = "e";
                else if (onT) handle = "n";
                else if (onB) handle = "s";
                return { idx: i, objId, handle };
            }
            return null;
        }

        function cursorForHandle(handle) {
            switch (handle) {
                case "nw": case "se": return "nwse-resize";
                case "ne": case "sw": return "nesw-resize";
                case "n": case "s": return "ns-resize";
                case "e": case "w": return "ew-resize";
                case "move": return "move";
                default: return "crosshair";
            }
        }

        function applyBoxDrag(dxImg, dyImg) {
            // dxImg/dyImg 为鼠标位移对应的图像像素增量；orig 为按下时的归一化框
            const d = trackDrag;
            if (!d) return;
            let [x, y, w, h] = d.orig;
            const dxn = dxImg / S.imgW, dyn = dyImg / S.imgH;
            const minW = Math.max(4 / S.imgW, 0.001);
            const minH = Math.max(4 / S.imgH, 0.001);
            if (d.handle === "move") {
                x = Math.min(Math.max(x + dxn, 0), 1 - w);
                y = Math.min(Math.max(y + dyn, 0), 1 - h);
            } else {
                let x1 = x, y1 = y, x2 = x + w, y2 = y + h;
                if (d.handle.includes("w")) x1 = Math.min(Math.max(x + dxn, 0), x2 - minW);
                if (d.handle.includes("e")) x2 = Math.max(Math.min(x + w + dxn, 1), x1 + minW);
                if (d.handle.includes("n")) y1 = Math.min(Math.max(y + dyn, 0), y2 - minH);
                if (d.handle.includes("s")) y2 = Math.max(Math.min(y + h + dyn, 1), y1 + minH);
                x = x1; y = y1; w = x2 - x1; h = y2 - y1;
            }
            S.trackObjects[d.idx] = [d.objId, x, y, w, h];
        }

        async function commitTrackFrame() {
            if (!S.video) return;
            const r = await api("/api/track/frame", {
                method: "POST",
                body: { index: S.frameIdx, objects: S.trackObjects },
            });
            if (r && r.ok) setStatus(`第 ${S.frameIdx} 帧跟踪框已保存（${r.count} 个目标）`, "success");
            else if (r) setStatus(r.error || "保存跟踪框失败", "error");
        }

        $("#cv").addEventListener("contextmenu", (e) => e.preventDefault());

        $("#cv").addEventListener("mousedown", (e) => {
            if (!S.img) return;
            // 阻止默认行为（如右键拖拽），减少浏览器手势误触发
            e.preventDefault();

            // 跟踪模式下优先处理跟踪框拖动（标注中则先走打点交互）
            if (S.viewMode === "tracking" && !S.isAnnotating && e.button === 0 && S.trackObjects.length) {
                const rect = $("#cv").getBoundingClientRect();
                const hit = hitTestBoxes(e.clientX - rect.left, e.clientY - rect.top);
                if (hit) {
                    trackDrag = {
                        idx: hit.idx,
                        objId: hit.objId,
                        handle: hit.handle,
                        orig: S.trackObjects[hit.idx].slice(1),
                        startX: e.clientX,
                        startY: e.clientY,
                    };
                    e.preventDefault();
                    return;
                }
            }

            if (!S.isAnnotating) return;
            const [x, y] = canvasToImage(e);
            if (x < 0 || x >= S.imgW || y < 0 || y >= S.imgH) return;

            if (e.button === 0) {
                // 点击起点附近 → 闭合多边形（自动生成 8 正 + 8 负）
                if (S.polyPoints.length >= 3 && nearFirstVertex(x, y)) {
                    finishPolygon();
                    return;
                }
                // 与上一个顶点过近则忽略（双击时会重复触发 mousedown）
                const last = S.polyPoints[S.polyPoints.length - 1];
                if (last && Math.abs(last[0] - x) < 2 && Math.abs(last[1] - y) < 2) return;
                S.polyPoints.push([x, y]);
                setStatus(`多边形顶点 ${S.polyPoints.length} 个${S.polyPoints.length >= 3 ? "（点击起点/双击/回车闭合）" : ""}`);
            } else if (e.button === 2) {
                // 右键撤销最后一个顶点
                if (!S.polyPoints.length) return;
                S.polyPoints.pop();
                setStatus(`已撤销顶点，剩余 ${S.polyPoints.length} 个`);
            } else {
                return;
            }

            updateAnnotUI();
            render();
        });

        $("#cv").addEventListener("mousemove", (e) => {
            if (!S.img) { $("#coordInfo").textContent = ""; return; }

            if (trackDrag) {
                // 拖动中：从按下点计算总位移
                applyBoxDrag(
                    (e.clientX - trackDrag.startX) / S.scale,
                    (e.clientY - trackDrag.startY) / S.scale
                );
                render();
            } else if (S.isAnnotating) {
                // 绘制多边形中：更新鼠标预览线
                S.polyMouse = canvasToImage(e);
                $("#cv").style.cursor = "crosshair";
                if (S.polyPoints.length) render();
            } else if (S.viewMode === "tracking" && S.trackObjects.length) {
                // 悬停手柄光标反馈
                const rect = $("#cv").getBoundingClientRect();
                const hit = hitTestBoxes(e.clientX - rect.left, e.clientY - rect.top);
                $("#cv").style.cursor = hit ? cursorForHandle(hit.handle) : "crosshair";
            } else {
                $("#cv").style.cursor = "crosshair";
            }

            const [x, y] = canvasToImage(e);
            $("#coordInfo").textContent =
                (x >= 0 && x < S.imgW && y >= 0 && y < S.imgH) ? `坐标: (${x}, ${y})` : "";
        });

        // 双击闭合多边形（第二下 mousedown 距上一点过近会被去重忽略）
        $("#cv").addEventListener("dblclick", () => {
            if (S.isAnnotating && S.polyPoints.length >= 3) finishPolygon();
        });

        window.addEventListener("mouseup", () => {
            if (trackDrag) {
                trackDrag = null;
                commitTrackFrame();
            }
        });

        /* ==================== 标注操作 ==================== */
        // 闭合多边形：生成 8 正 + 8 负样本点并保存当前目标（不自动开始下一个）
        async function finishPolygon() {
            if (!S.isAnnotating) return;
            if (cleanupPolygonPts(S.polyPoints).length < 3) {
                setStatus("多边形至少需要 3 个顶点", "error");
                return;
            }
            const savedId = S.currentObjId;
            await commitCurrentObject();
            setStatus(`目标 #${savedId} 标注完成（8 正 + 8 负）！可点击“开始标注新目标”继续。`, "success");
        }

        function startNextObject() {
            if (!S.video) return;
            S.isAnnotating = true;
            S.currentObjId = S.nextObjId;
            S.nextObjId += 1;
            S.polyPoints = [];
            S.polyMouse = null;
            updateAnnotUI();
            pushAnnotations();
            render();
        }

        async function commitCurrentObject() {
            if (!S.isAnnotating) return;
            const pts = S.polyPoints.length >= 3 ? cleanupPolygonPts(S.polyPoints) : [];
            if (pts.length < 3) {
                // 多边形未成型（顶点不足 3 个）：直接退出标注状态，不保存
                S.isAnnotating = false;
                S.polyPoints = [];
                S.polyMouse = null;
                updateAnnotUI();
                render();
                return;
            }
            // 自动生成 8 正 + 8 负样本点（参考零样本标注算法）
            const pos = samplePositivePoints(pts);
            const neg = sampleNegativePoints(pts);
            const objId = S.currentObjId;
            S.annotations[String(objId)] = {
                frame_idx: S.frameIdx,
                polygon: pts,
                points: pos.concat(neg),
                labels: pos.map(() => 1).concat(neg.map(() => 0)),
            };
            S.isAnnotating = false;
            S.polyPoints = [];
            S.polyMouse = null;
            await pushAnnotations();
            updateObjectList();
            updateAnnotUI();
            updateToolbarButtons();
            render();
            setStatus(`目标 #${objId} 已保存（${pos.length} 正 + ${neg.length} 负）`);
        }

        async function pushAnnotations() {
            await api("/api/annotations", {
                method: "POST",
                body: { annotations: S.annotations, next_obj_id: S.nextObjId },
            });
        }

        function deleteObject(objId) {
            if (!confirm(`确定要删除目标 #${objId} 吗？`)) return;
            delete S.annotations[String(objId)];
            if (S.selectedObjId === objId) S.selectedObjId = null;
            pushAnnotations();
            updateObjectList();
            updateToolbarButtons();
            render();
            setStatus(`目标 #${objId} 已删除`);
        }

        /* ==================== 工具栏事件 ==================== */
        async function openVideo(path) {
            if (!path) return setStatus("请先选择或输入视频路径", "error");
            const r = await api("/api/open_video", { method: "POST", body: { path } });
            if (!r || !r.ok) { setStatus((r && r.error) || "打开视频失败", "error"); return; }
            await refreshState(true);
            $("#showTrackChk").checked = false;
            S.viewMode = "frame";
            showFrame(0);
            setStatus(`视频加载完成: ${r.video.total_frames} 帧, ${r.video.fps.toFixed(1)} FPS, ${r.video.width}x${r.video.height}`, "success");
        }

        $("#openVideoBtn").addEventListener("click", () => openVideo($("#videoSelect").value));
        $("#openPathBtn").addEventListener("click", () => openVideo($("#videoPathInput").value.trim()));

        /* ---------- 上传视频 ---------- */
        $("#uploadVideoBtn").addEventListener("click", () => $("#uploadVideoFile").click());
        $("#uploadVideoFile").addEventListener("change", async (e) => {
            const file = e.target.files && e.target.files[0];
            e.target.value = "";
            if (!file) return;
            setStatus(`正在上传 ${file.name}（${(file.size / 1048576).toFixed(1)} MB）...`);
            const fd = new FormData();
            fd.append("file", file);
            try {
                const res = await fetch("/api/upload_video", { method: "POST", body: fd });
                const r = await res.json();
                if (!res.ok || !r || !r.ok) {
                    setStatus((r && r.error) || `上传失败 (HTTP ${res.status})`, "error");
                    return;
                }
                await loadVideos();
                await refreshState(true);
                $("#showTrackChk").checked = false;
                S.viewMode = "frame";
                showFrame(0);
                setStatus(`上传成功: ${r.video.name}（${r.video.total_frames} 帧）`, "success");
            } catch (err) {
                setStatus("上传失败: " + err, "error");
            }
        });
        $("#videoPathInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") openVideo(e.target.value.trim());
        });

        $("#saveProjectBtn").addEventListener("click", async () => {
            if (Object.keys(S.annotations).length === 0) return setStatus("没有可保存的标注", "error");
            const def = S.video ? S.video.name.replace(/\.[^.]+$/, "") + "_project" : "annotation_project";
            const name = prompt("保存项目名称:", def);
            if (name === null) return;
            const r = await api("/api/project/save", { method: "POST", body: { name } });
            if (!r || !r.ok) { setStatus((r && r.error) || "保存失败", "error"); return; }
            setStatus(`项目已保存到: ${r.path}`, "success");
            loadProjects();
        });

        async function loadProjects() {
            const r = await api("/api/project/list");
            const sel = $("#projectSelect");
            sel.innerHTML = "";
            if (!r || !r.projects.length) {
                sel.innerHTML = '<option value="">（无已保存项目）</option>';
                return;
            }
            for (const p of r.projects) {
                const opt = document.createElement("option");
                opt.value = p.name;
                opt.textContent = `${p.name}（${p.n_targets}个目标 | ${p.video_name || "无视频"}）`;
                sel.appendChild(opt);
            }
        }

        $("#refreshProjectsBtn").addEventListener("click", loadProjects);

        $("#loadProjectBtn").addEventListener("click", async () => {
            const name = $("#projectSelect").value;
            if (!name) return setStatus("请先选择要加载的项目", "error");
            const r = await api("/api/project/load", { method: "POST", body: { name } });
            if (!r || !r.ok) { setStatus((r && r.error) || "加载失败", "error"); return; }
            await refreshState(true);
            $("#showTrackChk").checked = false;
            S.viewMode = "frame";
            if (S.video) showFrame(0);
            if (r.warning) setStatus("⚠ " + r.warning, "error");
            else setStatus(`项目已加载: ${r.n_targets} 个标注目标（下一个目标 ID: ${S.nextObjId}）`, "success");
        });

        /* ---------- 模型 ---------- */
        $("#loadModelBtn").addEventListener("click", async () => {
            const gpu = parseInt($("#gpuSelect").value || "0", 10);
            const r = await api("/api/model/load", { method: "POST", body: { gpu } });
            if (!r || !r.ok) { setStatus((r && r.error) || "模型加载请求失败", "error"); return; }
            setStatus("正在加载 SAM3 模型，请稍候（首次加载可能需要较长时间）...");
            refreshState(false);
        });

        /* ---------- 跟踪 ---------- */
        $("#runTrackBtn").addEventListener("click", async () => {
            const r = await api("/api/track/start", { method: "POST" });
            if (!r || !r.ok) { setStatus((r && r.error) || "跟踪启动失败", "error"); return; }
            setStatus("正在启动 SAM3 会话...");
            refreshState(false);
        });

        $("#showTrackChk").addEventListener("change", async (e) => {
            S.viewMode = e.target.checked ? "tracking" : "frame";
            if (S.viewMode === "tracking") {
                // 退出标注状态（有未提交的点先保存），否则标注模式会拦截跟踪框的拖动
                await commitCurrentObject();
                await fetchTrackObjects();
            }
            render();
            updateTrackUI();
        });

        /* ---------- 导出（弹窗填写类别名） ---------- */
        function openExportModal() {
            const ids = sortedObjIds();
            if (ids.length === 0) { setStatus("没有可导出的标注目标", "error"); return; }
            const preview = autoClassPreview(ids);
            const box = $("#exportClassRows");
            box.innerHTML = "";
            for (const id of ids) {
                const clsId = S.idToClass[id] !== undefined ? S.idToClass[id] : preview[id];
                const nameVal = S.classNames[clsId] || "";
                const row = document.createElement("div");
                row.className = "clsRow";
                row.innerHTML =
                    `<span class="tag">#${id} (cls ${clsId})</span>` +
                    `<input type="text" class="expName" data-cls="${clsId}" ` +
                    `value="${nameVal.replace(/"/g, "&quot;")}" placeholder="类别名（可留空）">`;
                box.appendChild(row);
            }
            $("#exportModal").style.display = "flex";
        }

        function closeExportModal() {
            $("#exportModal").style.display = "none";
        }

        async function doExport() {
            // 收集弹窗中填写的类别名
            for (const input of document.querySelectorAll("#exportClassRows .expName")) {
                const name = input.value.trim();
                const cid = parseInt(input.dataset.cls, 10);
                if (Number.isNaN(cid)) continue;
                if (name) S.classNames[cid] = name;
                else delete S.classNames[cid];
            }
            await pushClassMap();
            closeExportModal();
            const name = $("#exportName").value.trim();
            const r = await api("/api/export", { method: "POST", body: { name } });
            if (!r || !r.ok) { setStatus((r && r.error) || "导出请求失败", "error"); return; }
            setStatus("正在导出 YOLO 标注...");
            refreshState(false);
        }

        $("#exportBtn").addEventListener("click", () => openExportModal());
        $("#exportCancelBtn").addEventListener("click", closeExportModal);
        $("#exportConfirmBtn").addEventListener("click", doExport);
        $("#exportModal").addEventListener("click", (e) => {
            if (e.target === $("#exportModal")) closeExportModal();
        });

        /* ---------- 帧导航 ---------- */
        let sliderTimer = null;
        $("#frameSlider").addEventListener("input", (e) => {
            const idx = parseInt(e.target.value, 10);
            S.frameIdx = idx;
            updateFrameUI();
            if (sliderTimer) clearTimeout(sliderTimer);
            sliderTimer = setTimeout(() => showFrame(idx), 130);
        });

        $("#jumpBtn").addEventListener("click", () => {
            const idx = parseInt($("#jumpInput").value, 10);
            if (isNaN(idx)) return setStatus("请输入有效的整数帧索引", "error");
            if (!S.video || idx < 0 || idx >= S.video.total_frames) {
                return setStatus(`帧索引超出范围 (0 - ${S.video ? S.video.total_frames - 1 : 0})`, "error");
            }
            showFrame(idx);
        });
        $("#jumpInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#jumpBtn").click(); });

        $("#stepBack10").addEventListener("click", () => S.video && showFrame(S.frameIdx - 10));
        $("#stepBack1").addEventListener("click", () => S.video && showFrame(S.frameIdx - 1));
        $("#stepFwd1").addEventListener("click", () => S.video && showFrame(S.frameIdx + 1));
        $("#stepFwd10").addEventListener("click", () => S.video && showFrame(S.frameIdx + 10));

        document.addEventListener("keydown", (e) => {
            if (!S.video) return;
            const tag = (document.activeElement || {}).tagName || "";
            if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
            // 多边形绘制中的键盘操作
            if (S.isAnnotating) {
                if (e.key === "Escape") {
                    S.polyPoints = [];
                    S.polyMouse = null;
                    updateAnnotUI();
                    render();
                    setStatus("已取消当前多边形");
                    return;
                }
                if (e.key === "Enter" && S.polyPoints.length >= 3) {
                    e.preventDefault();
                    finishPolygon();
                    return;
                }
            }
            if (e.key === "ArrowLeft") showFrame(S.frameIdx - 1);
            else if (e.key === "ArrowRight") showFrame(S.frameIdx + 1);
        });

        /* ---------- 标注按钮 ---------- */
        $("#startAnnotBtn").addEventListener("click", async () => {
            if (S.isAnnotating && S.polyPoints.length) {
                await commitCurrentObject();
            }
            startNextObject();
            setStatus(`开始标注目标 #${S.currentObjId}`);
        });

        $("#nextObjBtn").addEventListener("click", async () => {
            await commitCurrentObject();
            startNextObject();
        });

        $("#undoBtn").addEventListener("click", () => {
            if (!S.isAnnotating || !S.polyPoints.length) return;
            S.polyPoints.pop();
            updateAnnotUI();
            render();
            setStatus(`已撤销顶点，剩余 ${S.polyPoints.length} 个`);
        });

        $("#clearPointsBtn").addEventListener("click", () => {
            if (!S.isAnnotating) return;
            S.polyPoints = [];
            S.polyMouse = null;
            updateAnnotUI();
            render();
            setStatus("已清空当前多边形顶点");
        });

        /* ==================== 初始化 ==================== */
        async function loadVideos() {
            const r = await api("/api/videos");
            const sel = $("#videoSelect");
            sel.innerHTML = "";
            if (!r) return;
            if (!r.videos.length) {
                sel.innerHTML = '<option value="">（videos 目录下无视频）</option>';
                return;
            }
            for (const v of r.videos) {
                const opt = document.createElement("option");
                opt.value = v.path;
                opt.textContent = v.rel;
                sel.appendChild(opt);
            }
        }

        async function init() {
            // 阻止浏览器前进/后退导航：标注时右键操作易误触鼠标侧键或触控板横滑手势，
            // 导致页面被切走、标注状态丢失；用 history 占位并拦截 popstate 撤销此类导航
            history.pushState(null, "", location.href);
            window.addEventListener("popstate", () => {
                history.pushState(null, "", location.href);
            });

            await loadVideos();
            await loadProjects();
            await refreshState(true);
            updateFrameUI();
            render();
            window.addEventListener("resize", render);
            setInterval(() => refreshState(false), 2000);
        }

        init();
    </script>
</body>

</html>
